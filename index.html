<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfcfe" />
    <meta name="description" content="จับคู่ตีแบดมินตัน จัดตารางลงคอร์ทอัตโนมัติ ใช้งานออฟไลน์ ไม่ต้องสมัครสมาชิก" />
    <title>Bad Matchup · จับคู่ตีแบด</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // went back to the classic (v3) look in Settings? open there again, with
      // the hash, so share and room links still arrive. Never from inside
      // /classic/ itself, so a missing classic build cannot loop.
      try {
        if (
          localStorage.getItem('bad-matchup:ui') === 'classic' &&
          !location.pathname.includes('/classic/')
        )
          location.replace('./classic/' + location.hash)
      } catch {
        // storage blocked: stay on this version
      }
    </script>
    <script>
      // put the saved skin and theme on <html> before the first paint, so the
      // page never flashes another skin while the app loads
      try {
        const saved = JSON.parse(localStorage.getItem('bad-matchup:v1') || '{}')
        const root = document.documentElement
        root.dataset.skin = saved.skin || 'matchday'
        // keep in step with `darkOnly` in src/lib/skins.js
        const darkOnly = ['neon', 'chalk', 'champ'].includes(saved.skin)
        const dark =
          darkOnly ||
          (saved.theme ? saved.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
        root.classList.toggle('dark', dark)
      } catch {
        document.documentElement.dataset.skin = 'matchday'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
