<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d1d9c6" />
    <meta name="description" content="จับคู่ตีแบดมินตัน จัดตารางลงคอร์ทอัตโนมัติ ใช้งานออฟไลน์ ไม่ต้องสมัครสมาชิก" />
    <title>Bad Matchup · จับคู่ตีแบด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B8%3C/text%3E%3C/svg%3E"
    />
    <script>
      // put the saved skin and theme on <html> before the first paint, so the
      // page never flashes another skin while the app loads
      try {
        const saved = JSON.parse(localStorage.getItem('bad-matchup:v1') || '{}')
        const root = document.documentElement
        root.dataset.skin = saved.skin || 'classic'
        const dark = saved.theme
          ? saved.theme === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches
        root.classList.toggle('dark', dark)
      } catch {
        document.documentElement.dataset.skin = 'classic'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
